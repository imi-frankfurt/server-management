services:
  database:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-auth_db}
    networks:
      default:
        ipv4_address: ${DB_IP:-192.168.212.3}

    volumes:
      - ./db-data/:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  python-app:
    image: ghcr.io/imi-frankfurt/server-management:1.0.1
    container_name: fastapiapp
    command: ["/wait-for-it.sh", "database:5432", "--timeout=60", "--", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000"]
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${API_IP:-192.168.212.2}

networks:
  default:
    external: true
    name: imi-network
