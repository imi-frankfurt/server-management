name: PR Docker Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: docker.imi-frankfurt.de/server-management
  HARBOR_URL: https://docker.imi-frankfurt.de
  HARBOR_PROJECT: server-management
  IMAGE_NAME: backend
  ROBOT_USER: robot$imi-github

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Fork PRs have no access to HARBOR_TOKEN
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to IMI Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ROBOT_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64/v8
          cache-from: type=gha
          cache-to: type=gha,mode=max

  delete-image:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Delete PR image from Harbor
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          url="$HARBOR_URL/api/v2.0/projects/$HARBOR_PROJECT/repositories/$IMAGE_NAME/artifacts/$TAG"
          status=$(curl -sS -o response.txt -w '%{http_code}' -u "$ROBOT_USER:$HARBOR_TOKEN" -X DELETE "$url")
          case "$status" in
            200) echo "Deleted $IMAGE_NAME:$TAG" ;;
            404) echo "No image $IMAGE_NAME:$TAG found, nothing to delete" ;;
            *)   echo "::error::Deleting $IMAGE_NAME:$TAG failed with HTTP $status"; cat response.txt; exit 1 ;;
          esac
