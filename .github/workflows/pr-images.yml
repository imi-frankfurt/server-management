name: PR Docker Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: docker.imi-frankfurt.de/server-management
  HARBOR_URL: https://docker.imi-frankfurt.de
  HARBOR_PROJECT: server-management
  IMAGE_NAME: backend
  ROBOT_USER: robot$imi-github

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Fork PRs have no access to HARBOR_TOKEN
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to IMI Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ROBOT_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64/v8
          cache-from: type=gha
          cache-to: type=gha,mode=max

  delete-image:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Delete PR image from Harbor
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          base="$HARBOR_URL/api/v2.0/projects/$HARBOR_PROJECT/repositories/$IMAGE_NAME/artifacts"
          harbor() { curl -sS -o response.txt -w '%{http_code}' -u "$ROBOT_USER:$HARBOR_TOKEN" "$@"; }

          status=$(harbor "$base/$TAG")
          case "$status" in
            200) digest=$(jq -r .digest response.txt) ;;
            404) echo "No image $IMAGE_NAME:$TAG found, nothing to delete"; exit 0 ;;
            *)   echo "::error::Looking up $IMAGE_NAME:$TAG failed with HTTP $status"; cat response.txt; exit 1 ;;
          esac

          # Removing the tag always succeeds, even if the artifact itself can't be deleted yet
          status=$(harbor -X DELETE "$base/$digest/tags/$TAG")
          if [ "$status" != 200 ]; then
            echo "::error::Removing tag $TAG failed with HTTP $status"; cat response.txt; exit 1
          fi
          echo "Removed tag $IMAGE_NAME:$TAG ($digest)"

          status=$(harbor -X DELETE "$base/$digest")
          case "$status" in
            200|404) echo "Deleted $digest" ;;
            412)
              echo "::notice::$digest is still referenced by other artifacts, leaving it to the daily untagged cleanup"
              cat response.txt; echo
              page=1
              while :; do
                status=$(harbor "$base?page=$page&page_size=100&with_tag=true")
                [ "$status" = 200 ] && [ "$(jq length response.txt)" -gt 0 ] || break
                jq -r --arg d "$digest" '.[] | select(any(.references[]?; .child_digest == $d))
                  | "Referenced by \(.digest) (tags: \([.tags[]?.name] | join(", ")))"' response.txt
                page=$((page + 1))
              done
              ;;
            *) echo "::error::Deleting $digest failed with HTTP $status"; cat response.txt; exit 1 ;;
          esac
