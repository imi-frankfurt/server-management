services:
  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - auth-network

  database:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-auth_db}
    ports:
      - "5432:5432"
    networks:
      - auth-network
    volumes:
      - ./db-data/:/var/lib/postgresql

  python-app:
    build: .
    container_name: fastapiapp
    command: ["/wait-for-it.sh", "database:5432", "--", "fastapi", "dev", "app.py", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - .:/code
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - keycloak
    networks:
      - auth-network
    extra_hosts:
      - "keycloak.localhost:host-gateway"
networks:
  auth-network:
    driver: bridge