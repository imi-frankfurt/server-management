services:
  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: database
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      database:
        condition: service_healthy
    networks:
      - auth-network
  database:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-auth_db}
    ports:
      - "5432:5432"
    networks:
      - auth-network
    volumes:
      - ./db-data/:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  python-app:
    build: .
    container_name: fastapiapp
    command: ["/wait-for-it.sh", "database:5432", "--timeout=60", "--", "/wait-for-it.sh", "keycloak:8080", "--timeout=120", "--", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000", "--ssl-keyfile", "/certs/localhost+2-key.pem", "--ssl-certfile", "/certs/localhost+2.pem"]
    volumes:
      - .:/code
      - ./certs:/certs:ro
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - auth-network
    extra_hosts:
      - "keycloak.localhost:host-gateway"

networks:
  auth-network:
    driver: bridge